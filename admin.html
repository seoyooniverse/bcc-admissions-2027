<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>상담 신청 내역 | BCC 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="stylesheet" href="admin.css">
<script src="admin.js" defer></script>
</head>
<body>
<header><div class="wrap header"><div><strong>명지대학교 미래융합대학</strong><span>BCC 상담 신청 내역</span></div><button id="logout" type="button" hidden>로그아웃</button></div></header>
<main class="wrap">
  <section id="login-panel" class="login-panel"><h1>관리자 로그인</h1><p>상담 신청 내역과 문의 내용을 확인할 수 있습니다.</p><form id="login-form"><label for="password">관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">로그인</button></form><p id="login-message" class="message" role="status"></p></section>
  <section id="dashboard" hidden><div class="heading"><div><h1>상담 신청 내역</h1><p>최근 접수 순 · 최대 200건</p></div><button id="refresh" type="button">새로고침</button></div><div class="toolbar"><label for="filter">보기</label><select id="filter"><option value="all">전체</option><option value="booking">예약 상담</option><option value="callback">일정 조율 요청</option></select><span id="count"></span></div><p id="list-message" class="message" role="status"></p><div id="requests" class="requests"></div></section>
</main>
</body>
</html>
